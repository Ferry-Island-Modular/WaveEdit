name: build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: lin
            runner: ubuntu-22.04
          - arch: mac_arm64
            runner: macos-15
          - arch: win
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux toolchain + deps
        if: matrix.arch == 'lin'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential desktop-file-utils pkg-config libfreetype6-dev \
            libsdl2-dev libsndfile1-dev libsamplerate0-dev wget zip zenity xvfb

      - name: Install macOS deps via Homebrew
        if: matrix.arch == 'mac_arm64'
        run: |
          brew install sdl2 libsamplerate libsndfile freetype

      - name: Set up MSYS2 (Windows)
        if: matrix.arch == 'win'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-libsndfile
            mingw-w64-x86_64-libsamplerate
            make
            wget
            tar
            zip
            unzip

      - name: Build dep/ (macOS only)
        if: matrix.arch == 'mac_arm64'
        run: |
          cd dep && make

      - name: Build WaveEdit (Linux + macOS)
        if: matrix.arch != 'win'
        run: |
          make

      - name: Verify binary (Linux + macOS)
        if: matrix.arch != 'win'
        run: |
          test -x WaveEdit
          file WaveEdit

      - name: Test variable wave widths (Linux + macOS)
        if: matrix.arch != 'win'
        run: |
          make test-wave-width

      - name: Verify Linux binary has no GTK dependency
        if: matrix.arch == 'lin'
        run: |
          ! ldd WaveEdit | grep -i gtk

      - name: Populate dep/lib with system libraries (Linux)
        if: matrix.arch == 'lin'
        run: |
          mkdir -p dep/lib
          LIBDIR=$(pkg-config --variable=libdir sdl2)
          ln -sf $LIBDIR/libSDL2-2.0.so.0 dep/lib/
          ln -sf $(pkg-config --variable=libdir samplerate)/libsamplerate.so.0 dep/lib/
          ln -sf $(pkg-config --variable=libdir sndfile)/libsndfile.so.1 dep/lib/

      - name: Build dist zip (Linux + macOS)
        if: matrix.arch != 'win'
        run: |
          make dist

      - name: Verify macOS bundle is self-contained
        if: matrix.arch == 'mac_arm64'
        run: |
          executable=dist/WaveEdit/WaveEdit.app/Contents/MacOS/WaveEdit
          ! otool -L "$executable" | grep -E '/(opt/homebrew|usr/local)/'
          otool -L "$executable" | grep -F '@executable_path/libSDL2-2.0.0.dylib'
          codesign --verify --deep --strict --verbose=2 dist/WaveEdit/WaveEdit.app

      # Pin a dated linuxdeploy release, not the rolling "continuous" tag:
      # continuous is rebuilt upstream at will, which silently invalidates a
      # pinned checksum (it broke CI on 2026-08-01).
      - name: Download verified linuxdeploy (Linux)
        if: matrix.arch == 'lin'
        run: |
          wget -q \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage \
            -O linuxdeploy-x86_64.AppImage
          echo "c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  linuxdeploy-x86_64.AppImage" \
            | sha256sum -c -
          chmod +x linuxdeploy-x86_64.AppImage

      - name: Build AppImage (Linux)
        if: matrix.arch == 'lin'
        run: |
          desktop-file-validate packaging/linux/waveedit.desktop
          make appimage LINUXDEPLOY=./linuxdeploy-x86_64.AppImage
          test -x dist/WaveEdit-*-x86_64.AppImage

      - name: Smoke-test AppImage (Linux)
        if: matrix.arch == 'lin'
        run: |
          set +e
          timeout 5s env APPIMAGE_EXTRACT_AND_RUN=1 SDL_AUDIODRIVER=dummy \
            xvfb-run -a dist/WaveEdit-*-x86_64.AppImage > appimage-smoke.log 2>&1
          status=$?
          set -e
          cat appimage-smoke.log
          test "$status" -eq 124
          grep -F "theme: loaded 12 theme(s)" appimage-smoke.log

      - name: Build WaveEdit (Windows)
        if: matrix.arch == 'win'
        shell: msys2 {0}
        run: |
          make ARCH=win

      - name: Verify binary (Windows)
        if: matrix.arch == 'win'
        shell: msys2 {0}
        run: |
          test -x WaveEdit.exe
          file WaveEdit.exe

      - name: Test variable wave widths (Windows)
        if: matrix.arch == 'win'
        shell: msys2 {0}
        run: |
          make ARCH=win test-wave-width

      - name: Populate dep/bin with system DLLs (Windows)
        if: matrix.arch == 'win'
        shell: msys2 {0}
        run: |
          mkdir -p dep/bin
          cp /mingw64/bin/SDL2.dll dep/bin/
          cp /mingw64/bin/libsamplerate-0.dll dep/bin/
          cp /mingw64/bin/libsndfile-1.dll dep/bin/

      - name: Build dist zip (Windows)
        if: matrix.arch == 'win'
        shell: msys2 {0}
        run: |
          make dist

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: WaveEdit-${{ matrix.arch }}
          path: |
            dist/WaveEdit-*.zip
            dist/WaveEdit-*.AppImage
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (for release notes generation)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release assets and checksums
        shell: bash
        run: |
          mkdir release-assets
          mapfile -t release_assets < <(
            find artifacts -type f \
              \( -name 'WaveEdit-*.zip' -o -name 'WaveEdit-*.AppImage' \) \
              -print
          )
          test "${#release_assets[@]}" -eq 4
          cp "${release_assets[@]}" release-assets/
          (
            cd release-assets
            sha256sum WaveEdit-* > SHA256SUMS
          )

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_args=(
            --draft
            --generate-notes
            --title "${{ github.ref_name }}"
            --verify-tag
          )
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            release_args+=(
              --prerelease
              --latest=false
              --notes-file doc/beta-release-notes.md
            )
          fi
          gh release create "${{ github.ref_name }}" \
            "${release_args[@]}" \
            release-assets/*
